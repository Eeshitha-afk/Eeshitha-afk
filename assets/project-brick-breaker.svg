<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Brick Breaker project poster</title><desc id="desc">A bold animated poster for a browser Brick Breaker game built with Canvas and JavaScript.</desc>
  <style>
    .bg{fill:#111113}.paper{fill:#f3efe4}.ink{fill:#111113}.light{fill:#f3efe4}.accent{fill:#ff5c35}.muted{fill:#9d988e}.rule{stroke:#f3efe4;stroke-width:1;opacity:.2}.outline{fill:none;stroke:#f3efe4;stroke-width:2}
    .label{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px}.hero{font:850 78px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-5px}.body{font:500 18px system-ui,-apple-system,"Segoe UI",sans-serif}
    .brick-a{animation:brick-a 4s steps(1,end) infinite}.brick-b{animation:brick-b 4s steps(1,end) infinite}.ball{animation:bounce 4s cubic-bezier(.45,0,.55,1) infinite}.paddle{animation:slide 4s ease-in-out infinite}
    @keyframes bounce{0%{transform:translate(0,80px)}24%{transform:translate(88px,-48px)}48%{transform:translate(176px,40px)}72%{transform:translate(84px,132px)}100%{transform:translate(0,80px)}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(86px)}}@keyframes brick-a{0%,46%,100%{opacity:1}47%,99%{opacity:.12}}@keyframes brick-b{0%,71%,100%{opacity:1}72%,99%{opacity:.12}}
    @media(prefers-color-scheme:light){.bg{fill:#f3efe4}.paper{fill:#111113}.ink{fill:#f3efe4}.light{fill:#111113}.rule{stroke:#111113}.outline{stroke:#111113}.muted{fill:#68645d}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect class="bg" width="1200" height="470" rx="18"/><text class="accent label" x="58" y="62">SELECTED EXPERIMENT / 001</text><line class="rule" x1="58" y1="84" x2="1142" y2="84"/>
  <text class="light hero" x="54" y="178">BRICK</text><text class="light hero" x="54" y="254">BREAKER</text><rect class="accent" x="59" y="278" width="124" height="8" rx="4"/>
  <text class="muted body" x="60" y="329"><tspan x="60">Canvas, vanilla JavaScript, power-ups,</tspan><tspan x="60" dy="29">difficulty levels, scores, and a leaderboard.</tspan></text><text class="light label" x="60" y="424">OPEN SOURCE / VIEW PROJECT</text>
  <g transform="translate(716 116)"><rect class="outline" width="418" height="288" rx="8"/><g transform="translate(31 30)"><rect class="paper" width="70" height="28" rx="3"/><rect class="paper brick-a" x="82" width="70" height="28" rx="3"/><rect class="accent" x="164" width="70" height="28" rx="3"/><rect class="paper" x="246" width="70" height="28" rx="3"/><rect class="paper" x="41" y="41" width="70" height="28" rx="3"/><rect class="accent brick-b" x="123" y="41" width="70" height="28" rx="3"/><rect class="paper" x="205" y="41" width="70" height="28" rx="3"/><rect class="paper" x="287" y="41" width="70" height="28" rx="3"/><circle class="accent ball" cx="78" cy="72" r="13"/><rect class="paper paddle" x="92" y="216" width="116" height="15" rx="7.5"/></g><text class="muted label" x="26" y="273">LEVEL 01 / KEEP IT MOVING</text></g>
</svg>
