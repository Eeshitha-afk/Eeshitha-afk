<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Eeshitha kinetic profile header</title>
  <desc id="desc">An animated editorial banner with the name Eeshitha and rotating creative statements.</desc>
  <style>
    .background{fill:#0d0d0f}.frame{fill:none;stroke:#39383a;stroke-width:1}
    .ink{fill:#f4f1e8}.muted{fill:#aaa7a0}.accent{fill:#ff5c35}
    .line{fill:none;stroke:#39383a;stroke-width:1.4}.accent-line{fill:none;stroke:#ff5c35;stroke-width:2}
    .name{font:800 140px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-10px}
    .phrase{font:500 25px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.5px}
    .micro{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px}
    .reveal{animation:reveal 1.2s cubic-bezier(.2,.8,.2,1) both;transform-origin:70px 180px}
    .orbit-a{animation:draw 7s ease-in-out infinite}.orbit-b{animation:draw 9s ease-in-out infinite reverse}
    .orbit-c{animation:breathe 5s ease-in-out infinite;transform-origin:1010px 205px}
    .dot-a{animation:float-a 6s ease-in-out infinite}.dot-b{animation:float-b 8s ease-in-out infinite}
    .tracker{animation:track 5s cubic-bezier(.4,0,.2,1) infinite}
    .phrase-1{animation:phrase-one 9s ease-in-out infinite}.phrase-2,.phrase-3{opacity:0}.phrase-2{animation:phrase-two 9s ease-in-out infinite}.phrase-3{animation:phrase-three 9s ease-in-out infinite}
    @keyframes reveal{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{0%,100%{stroke-dasharray:20 12;stroke-dashoffset:0;opacity:.45}50%{stroke-dasharray:7 16;stroke-dashoffset:75;opacity:.9}}
    @keyframes breathe{0%,100%{transform:scale(.96) rotate(-2deg);opacity:.45}50%{transform:scale(1.04) rotate(2deg);opacity:.9}}
    @keyframes float-a{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,12px)}}
    @keyframes float-b{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-16px)}}
    @keyframes track{0%,12%{transform:translateX(0)}50%,62%{transform:translateX(510px)}100%{transform:translateX(0)}}
    @keyframes phrase-one{0%,25%{opacity:1;transform:translateY(0)}31%,94%{opacity:0;transform:translateY(-9px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes phrase-two{0%,28%{opacity:0;transform:translateY(9px)}34%,59%{opacity:1;transform:translateY(0)}65%,100%{opacity:0;transform:translateY(-9px)}}
    @keyframes phrase-three{0%,62%{opacity:0;transform:translateY(9px)}68%,93%{opacity:1;transform:translateY(0)}99%,100%{opacity:0;transform:translateY(-9px)}}
    @media(prefers-color-scheme:light){
      .background{fill:#f5f2e9}.frame{stroke:#c9c4b9}.ink{fill:#111113}.muted{fill:#65615b}.accent{fill:#e7431b}.line{stroke:#c9c4b9}.accent-line{stroke:#e7431b}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.phrase-2,.phrase-3{display:none}}
  </style>
  <rect class="background" width="1200" height="420" rx="22"/>
  <rect class="frame" x="18" y="18" width="1164" height="384" rx="14"/>
  <text class="muted micro" x="70" y="68">GITHUB PROFILE / 2026</text>
  <circle class="accent dot-a" cx="1128" cy="62" r="5"/>
  <text class="muted micro" x="1018" y="68">ONLINE</text>
  <g class="reveal">
    <text class="ink name" x="61" y="216">EESHITHA</text>
    <rect class="accent" x="70" y="236" width="84" height="7" rx="3.5"/>
  </g>
  <g transform="translate(72 301)">
    <text class="ink phrase phrase-1">I make digital things that feel alive.</text>
    <text class="ink phrase phrase-2">Curiosity in. Better ideas out.</text>
    <text class="ink phrase phrase-3">Build. Break. Learn. Refine.</text>
  </g>
  <line class="line" x1="72" y1="351" x2="582" y2="351"/>
  <rect class="accent tracker" x="72" y="346" width="34" height="10" rx="5"/>
  <text class="muted micro" x="72" y="382">SCROLL TO EXPLORE</text>
  <g aria-hidden="true">
    <ellipse class="line orbit-a" cx="1010" cy="210" rx="116" ry="155" transform="rotate(24 1010 210)"/>
    <ellipse class="accent-line orbit-b" cx="1010" cy="210" rx="82" ry="148" transform="rotate(-31 1010 210)"/>
    <ellipse class="line orbit-c" cx="1010" cy="210" rx="138" ry="64" transform="rotate(9 1010 210)"/>
    <circle class="ink dot-b" cx="927" cy="99" r="8"/>
    <circle class="accent dot-a" cx="1097" cy="318" r="12"/>
    <circle class="muted" cx="1010" cy="210" r="4"/>
  </g>
</svg>
