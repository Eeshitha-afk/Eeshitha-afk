<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Brick Breaker project poster</title><desc id="desc">A bold animated poster for a browser Brick Breaker game built with Canvas and JavaScript.</desc>
  <style>
    .bg{fill:#0b1020}.paper{fill:#f7f7ed}.ink{fill:#11172b}.light{fill:#f7f7ed}.accent,.green{fill:#55d878}.blue{fill:#4aa8ff}.yellow{fill:#f7d64a}.purple{fill:#9b7cff}.muted{fill:#a7b3ca}.rule{stroke:#6f82a8;stroke-width:1;opacity:.35}.outline{fill:none;stroke:#8ca3cf;stroke-width:2}
    .label{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px}.hero{font:850 78px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-5px}.body{font:500 18px system-ui,-apple-system,"Segoe UI",sans-serif}
    .brick-a{animation:brick-a 4s steps(1,end) infinite}.brick-b{animation:brick-b 4s steps(1,end) infinite}.ball{animation:bounce 4s cubic-bezier(.45,0,.55,1) infinite}.paddle{animation:slide 4s ease-in-out infinite}
    @keyframes bounce{0%{transform:translate(0,80px)}24%{transform:translate(88px,10px)}48%{transform:translate(176px,10px)}72%{transform:translate(84px,131px)}100%{transform:translate(0,80px)}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(86px)}}@keyframes brick-a{0%,47%,95%,100%{opacity:1}48%,94%{opacity:.12}}@keyframes brick-b{0%,23%,95%,100%{opacity:1}24%,94%{opacity:.12}}
    @media(prefers-color-scheme:light){.bg{fill:#eef4ff}.paper{fill:#11172b}.ink{fill:#eef4ff}.light{fill:#11172b}.rule{stroke:#5472ad}.outline{stroke:#334f88}.muted{fill:#5a6780}.accent,.green{fill:#168b50}.blue{fill:#277bd0}.yellow{fill:#a97800}.purple{fill:#7554d1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect class="bg" width="1200" height="470" rx="18"/><text class="accent label" x="58" y="62">SELECTED EXPERIMENT / 001</text><line class="rule" x1="58" y1="84" x2="1142" y2="84"/>
  <text class="light hero" x="54" y="178">BRICK</text><text class="light hero" x="54" y="254">BREAKER</text><rect class="accent" x="59" y="278" width="124" height="8" rx="4"/>
  <text class="muted body" x="60" y="329"><tspan x="60">Canvas, vanilla JavaScript, power-ups,</tspan><tspan x="60" dy="29">difficulty levels, scores, and a leaderboard.</tspan></text><text class="light label" x="60" y="424">OPEN SOURCE / VIEW PROJECT</text>
  <g transform="translate(716 116)"><rect class="outline" width="418" height="288" rx="8"/><g transform="translate(31 30)"><rect class="green" width="70" height="28" rx="3"/><rect class="blue" x="82" width="70" height="28" rx="3"/><rect class="purple" x="164" width="70" height="28" rx="3"/><rect class="yellow" x="246" width="70" height="28" rx="3"/><rect class="blue" x="41" y="41" width="70" height="28" rx="3"/><rect class="green brick-b" x="123" y="41" width="70" height="28" rx="3"/><rect class="yellow brick-a" x="205" y="41" width="70" height="28" rx="3"/><rect class="purple" x="287" y="41" width="70" height="28" rx="3"/><circle class="yellow ball" cx="78" cy="72" r="13"/><rect class="blue paddle" x="92" y="216" width="116" height="15" rx="7.5"/></g><text class="muted label" x="26" y="273">LEVEL 01 / KEEP IT MOVING</text></g>
</svg>
